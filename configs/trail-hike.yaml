# HIKING capture: 360 camera on a backpack pole, for trail previews.
# Riding the same trail? Use configs/trail-bike.yaml -- the sampling maths
# inverts at 3-6 m/s and a helmet mount breaks two assumptions this one makes.
#
# UNPROVEN. Every other config in here has been run on real footage; this one
# is derived from the driving settings by reasoning about what actually
# differs, and the numbers are starting points to measure against, not results.
# See docs/TRAILVIEW.md for the reasoning behind each choice.
#
# The camera is the same, so the profile, the lens geometry and the per-lens
# view planning all carry over untouched (docs/SEAM.md). What changes:
#
# 1. SAMPLING DENSITY GOES UP, not down. The instinct is to sample less often
#    because walking is slow. Backwards: frame spacing has to preserve overlap
#    between consecutive views, and how much a view changes per metre depends
#    on how FAR AWAY the scene is. A road capture looks at surfaces 5-30 m out;
#    a trail looks at foliage 1-3 m out, so the same metre of travel moves the
#    scene several times as much. Hence 0.6 m here against 1.25 m on road.
#
# 2. EXTRACT RATE GOES DOWN. At walking pace (~1.4 m/s) even 8 fps puts
#    candidates 0.18 m apart -- still 3-4 to choose the sharpest from inside
#    each 0.6 m window, which is the whole point of extracting faster than we
#    keep. 24 fps here would just be decode cost.
#
# 3. PITCH DOWN FURTHER. A pole mount sits ~2 m up with the ground 2 m below
#    and close, versus a road surface further out ahead of a car. -15 keeps
#    trail tread in frame without wasting pixels on sky.
#
# 4. TIGHT CORRIDOR. A trail is metres wide, not a road's 25. Too generous and
#    floater pruning stops doing anything; too tight and the viewer's rail
#    clips scenery the walker actually saw.
#
# Capture protocol: stabilization OFF (it rotates the image relative to the
# sensor and breaks the fixed lens-boundary geometry the view plan depends on),
# shutter locked fast, overcast or even light, walk at a steady pace, and do
# the trail in both directions.
ingest:
  # profile: gopro-max2      # auto-detected; pin if the footage is ambiguous
  fov: 80
  px_per_deg: 24
  pitch: [-15]
  view_overlap_deg: 12
  extract_fps: 8
  spacing_m: 0.6
  jpeg_quality: 96

chunk:
  # Trails are long and one-dimensional, so cells are smaller than the road
  # case to keep any single chunk inside the range where COLMAP's mapper is
  # still fast (see HANDOFF.md 2.4: 954 images map in 22 min, 3,870 in 4h53m).
  #
  # NOTE the open problem: grid chunking assumes usable absolute positions, and
  # canopy GPS is 5-20 m. Bad positions scatter one contiguous walk across
  # cells. Chunking by ALONG-TRACK distance instead would not care -- that is
  # the change docs/TRAILVIEW.md calls for, and it is not written yet.
  cell_m: 80
  overlap_m: 25
  min_frames: 20

corridor:
  radius_m: 6            # a trail, not a road
  height_margin_m: 5
  min_spacing_m: 3
  gap_m: 20

poses:
  # Spatial matching leans on GPS priors, which canopy degrades badly. The
  # sequential pass poses.py runs alongside it needs no GPS at all and is a
  # strong graph on a linear trail -- expect it to be doing most of the work
  # here. If registration still collapses, that is the along-track chunking
  # problem above, not a matcher setting.
  matcher: spatial
  align: true
