# Smoke test on the INRIA H3DGS toy dataset (just fetch-toy).
# Flat (already-pinhole) images, no GPS -> sequential matching, no alignment.
ingest:
  projection: flat
  spacing_m: 0            # keep every frame; toy images are pre-selected

chunk:
  chunk_m: 0              # single chunk

poses:
  matcher: sequential
  align: false
