# Higher-quality capture profile for 360 driving footage.
#
# The three levers that actually move quality, in order of how much they moved
# it on real capture:
#
# 1. ONE LENS PER IMAGE. The virtual cameras are planned inside each physical
#    lens' cone (splatpipe/viewplan.py) instead of on a fixed yaw ring, so no
#    training image straddles the lens boundary. The old ring put that boundary
#    -- a real 3 cm change of viewpoint -- at yaw +-90, i.e. broadside, i.e. on
#    the parked cars and house fronts closest to the camera. That is where the
#    doubled truck and the half-missing roof came from. This costs nothing:
#    three 80 deg views per lens is the same six images the ring produced.
#
# 2. ANGULAR RESOLUTION. 8K EAC faces hold ~21 px/deg; 24 px/deg of virtual
#    camera means the reframing is not the bottleneck. Below ~16 we were
#    throwing away a quarter of the detail the camera recorded.
#
# 3. SAMPLE DENSITY AND BOTH-DIRECTION COVERAGE. 1.25 m frame spacing plus a
#    pass in each direction gives every surface more observations from more
#    angles, which is what constrains geometry a single camera height leaves
#    ambiguous.
#
# What this CANNOT fix: every lens still sits at one height on the roof. A
# second physical camera lower down is the real answer to road-surface
# ambiguity -- add it as its own `pinhole` ingest and merge at the chunk stage.
ingest:
  # profile: gopro-max2      # uncomment to pin; otherwise auto-detected
  fov: 80                    # per view, degrees -- 3 views/lens at this width
  px_per_deg: 24
  pitch: [-12]
  view_overlap_deg: 12       # minimum overlap between adjacent views
  # Extract EVERY frame the camera shot (24 fps) even though we keep one per
  # 1.25 m. Two reasons. First, at 21.5 mph a 6 fps extract puts candidates
  # 1.60 m apart, so spacing_m never engages and the setting silently lies.
  # Second, the frame we keep is the sharpest in its window, so more
  # candidates per window is free quality -- 3 to choose from instead of 1.5.
  # Denser than 1.25 m is poor value: consecutive frames half a metre apart
  # are near-duplicate viewpoints that cost compute without constraining
  # geometry. View count and both-direction coverage buy far more.
  extract_fps: 24
  spacing_m: 1.25
  jpeg_quality: 96

chunk:
  cell_m: 150
  overlap_m: 40
  min_frames: 20

corridor:
  radius_m: 25
  height_margin_m: 8
  min_spacing_m: 5
  gap_m: 30

poses:
  matcher: spatial
  align: true
