# Capture campaign: the Crofton–Annapolis back-road network.
# All roads radiate from Staples Corner (MD 424 @ MD 450).
campaign:
  name: md-backroads
  anchor: "Staples Corner, MD 424 @ MD 450"
  roads:
    - "MD 450 (Crofton to Annapolis)"
    - "St. Stephens Church Rd"
    - "Chesterfield Rd"
    - "Hawkins Rd"
    - "Rutland Rd"
    - "Rossback Rd"
    - "Bell Branch Rd"
    - "Crownsville Rd"
    - "Honeysuckle Ln"
    - "Underwood Rd"
    - "Johns Hopkins Rd"
    - "Severn Chapel Rd"
    - "Waterbury Rd"
    - "Bacon Ridge Rd"
    - "Generals Hwy"
    - "Governors Bridge Rd"
    - "Patuxent River Rd"
    - "MD 424 (MD 214 to MD 450)"
  # capture protocol: both directions, 20-30 mph, overcast, low sun movement,
  # shutter locked >= 1/1000s, stabilization OFF, roof rig on the Rivian.

ingest:
  # Camera is auto-detected from the file (see `splatpipe profiles`); the view
  # plan is then laid out inside each lens' cone, so no training image crosses
  # the lens boundary. Survey settings: wider/cheaper than configs/hq.yaml.
  fov: 90
  px_per_deg: 18
  pitch: [-10]
  extract_fps: 6            # candidates; final pick is distance-based
  spacing_m: 1.75           # one kept frame per ~1.75m of travel
  jpeg_quality: 95

chunk:
  # locality grid: every pass through a cell feeds that cell's chunk
  cell_m: 200
  overlap_m: 40
  min_frames: 20

corridor:
  radius_m: 25          # how far off the driven line still counts as observed
  height_margin_m: 8
  min_spacing_m: 5      # polyline decimation
  gap_m: 30             # jump that splits one pass from the next

poses:
  matcher: spatial          # GPS priors from EXIF; handles both-direction passes
  align: true               # ENU geo-registration via colmap model_aligner
