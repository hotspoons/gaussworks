[project]
name = "splatpipe"
version = "0.1.0"
description = "Car-mounted 360 capture -> chunked, geo-aligned gaussian splat pipeline"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pyyaml",
    "requests",
    "piexif",
]

[project.scripts]
splatpipe = "splatpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["splatpipe"]
