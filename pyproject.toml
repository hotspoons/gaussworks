[project]
name = "splatpipe"
version = "0.1.0"
description = "Car-mounted 360 capture -> chunked, geo-aligned gaussian splat pipeline"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pyyaml",
    "requests",
    "piexif",
]

[project.scripts]
splatpipe = "splatpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already ships everything under splatpipe/, data files included --
# the camera profiles in splatpipe/data/profiles are inside the package dir.
# There was a force-include for them here as well, which added each profile to
# the wheel a SECOND time at the same path and made hatchling refuse to build:
#   ValueError: A second file is being added to the wheel archive at the same
#   path: `splatpipe/data/profiles/equirect-360.yaml`
# It never showed up locally because an editable install builds no wheel; the
# container image does, and that is where it surfaced.
packages = ["splatpipe"]
