# Batch deployment for a whole capture on a multi-GPU cluster.
#
# Shape: ONE head pod does the serial, decode-bound stages (ingest, mask,
# chunk, merge) and N worker pods pull the GPU stages from the claim-based
# queue on the shared volume. Plain Pod/Job rather than a ZipspaceDeployment:
# no operator involved, and `kubectl exec` is the whole interface.
#
# BEFORE YOU APPLY THIS, COUNT THE FREE GPUs. This cluster is shared; other
# people's inference and recon services sit on it, and a Job that asks for
# more GPUs than are free does not fail -- it runs short-handed with pods
# Pending forever, which looks exactly like slow progress. See deploy/README.md.
#
# Every image here is multi-arch, because gh200-1 is aarch64.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: splats-work
  namespace: default
  labels: {app: splats, patapsco.ai/keep: "true"}
spec:
  # RWX, NOT RWO. deploy/devpod.yaml asks for ReadWriteOnce because it was
  # written for one interactive pod; poses and train claim work from a queue
  # on this volume, so every worker has to mount it at once.
  accessModes: [ReadWriteMany]
  storageClassName: ceph-filesystem
  resources: {requests: {storage: 1Ti}}
---
apiVersion: v1
kind: Pod
metadata:
  name: splats-head
  namespace: default
  labels: {app: splats, role: head}
spec:
  restartPolicy: Never
  volumes:
    - {name: work, persistentVolumeClaim: {claimName: splats-work}}
    - {name: shm, emptyDir: {medium: Memory, sizeLimit: 32Gi}}
  containers:
    - name: head
      # Multi-arch and ships nvcc 13.0, so pod-build-stack.sh adopts the
      # toolkit instead of downloading a second one.
      image: nvidia/cuda:13.0.2-devel-ubuntu24.04
      command: ["bash","-lc","mkdir -p /workspace/logs && sleep infinity"]
      workingDir: /workspace
      env:
        - {name: DEBIAN_FRONTEND, value: noninteractive}
        - {name: HOME, value: /root}
      volumeMounts:
        - {mountPath: /workspace, name: work}
        - {mountPath: /dev/shm, name: shm}     # 64 MB default kills gsplat's loader
      resources:
        # A GPU here is only for ffmpeg NVDEC during ingest. Recreate this pod
        # WITHOUT the gpu limit before running the workers, or the head holds
        # one of the GPUs they are waiting for.
        limits: {nvidia.com/gpu: 1, memory: 128Gi}
        requests: {cpu: "16", memory: 32Gi}
